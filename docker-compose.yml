services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: afrolink
      POSTGRES_PASSWORD: afrolink
      POSTGRES_DB: afrolink_news
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afrolink -d afrolink_news"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://afrolink:afrolink@postgres:5432/afrolink_news?schema=public
      JWT_SECRET: change-this-to-a-secure-secret-at-least-32-chars
      JWT_EXPIRES_IN: 24h
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
      NODE_ENV: production
      CORS_ORIGINS: http://localhost:3000
      TRUST_PROXY: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
